name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Cap workers at 50% of the runner's cores: the shared ubuntu-latest runner
      # (~2-4 vCPU) starves the event loop when jest fans all suites across
      # workers, intermittently tripping a heavy async screen test's 5s wall-clock
      # timeout (flaky failure on PR #46). Cutting contention is the root-cause fix;
      # widen timeouts only if flakes persist. CI-only — local `npm test` unchanged.
      - run: npm test -- --ci --maxWorkers=50%
